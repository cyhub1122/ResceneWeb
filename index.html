<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI 模型聚合助手 · Kilo + Zen 免 Key 网关</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --text:#e7e9ee; --muted:#8b93a3; --accent:#4f8cff; --accent2:#07c160;
    --user:#0a6d4e; --bot:#1e2632; --warn:#e6a23c; --danger:#f56c6c;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  header{
    padding:12px 16px; border-bottom:1px solid var(--line); background:var(--panel);
    position:sticky; top:0; z-index:10;
  }
  .top{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .brand{font-weight:700; font-size:15px; white-space:nowrap}
  .brand .dot{color:var(--accent2)}
  .badge{font-size:11px; color:var(--accent2); background:rgba(7,193,96,.12);
    border:1px solid rgba(7,193,96,.35); padding:1px 7px; border-radius:20px; white-space:nowrap}
  .spacer{flex:1}
  .seg{display:inline-flex; background:var(--panel2); border:1px solid var(--line); border-radius:10px; overflow:hidden}
  .seg button{
    border:0; background:transparent; color:var(--muted); padding:7px 14px; cursor:pointer;
    font-size:13px; transition:.15s;
  }
  .seg button.on{background:var(--accent); color:#fff}
  main{flex:1; overflow-y:auto; padding:16px; max-width:860px; width:100%; margin:0 auto; display:flex; flex-direction:column}
  #chat{display:flex; flex-direction:column; gap:14px}
  .msg{max-width:86%; display:flex; flex-direction:column}
  .msg.user{align-self:flex-end; align-items:flex-end}
  .msg.bot{align-self:flex-start; align-items:flex-start}
  .meta{font-size:11px; color:var(--muted); margin:0 4px 4px; display:flex; gap:6px; align-items:center}
  .bubble{
    padding:10px 14px; border-radius:var(--radius); line-height:1.6; white-space:pre-wrap;
    word-break:break-word; font-size:14.5px;
  }
  .user .bubble{background:var(--user); color:#eafff5; border-bottom-right-radius:4px}
  .bot .bubble{background:var(--bot); border:1px solid var(--line); border-bottom-left-radius:4px}
  .bubble .think{
    display:block; color:var(--muted); font-size:12.5px; line-height:1.5;
    border-left:3px solid var(--line); padding-left:10px; margin-bottom:10px;
    white-space:pre-wrap; max-height:120px; overflow:hidden; position:relative;
  }
  .bubble .think.open{max-height:none}
  .think-toggle{color:var(--accent); cursor:pointer; font-size:12px; user-select:none; margin-left:4px}
  .cursor{display:inline-block; width:8px; height:15px; background:var(--accent);
    vertical-align:-2px; margin-left:2px; animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .empty{color:var(--muted); text-align:center; margin-top:40px; font-size:14px}
  .empty .hint{font-size:12px; color:var(--muted); opacity:.7; margin-top:8px}
  footer{
    border-top:1px solid var(--line); background:var(--panel); padding:10px 12px 12px;
    position:sticky; bottom:0; z-index:10;
  }
  .row{display:flex; gap:8px; align-items:center; max-width:860px; margin:0 auto; flex-wrap:wrap}
  .controls{display:flex; gap:8px; flex-wrap:wrap; max-width:860px; margin:0 auto 8px}
  select,input[type=text],input[type=password],input[type=number]{
    background:var(--panel2); border:1px solid var(--line); color:var(--text);
    border-radius:9px; padding:9px 10px; font-size:13.5px; outline:none;
  }
  select:focus,input:focus{border-color:var(--accent)}
  #model{flex:1; min-width:180px}
  #input{flex:1; min-width:200px}
  #send{
    padding:10px 18px; border:none; background:var(--accent2); color:#fff; border-radius:9px;
    cursor:pointer; font-size:14px; font-weight:600;
  }
  #send:disabled{opacity:.5; cursor:not-allowed}
  .icon-btn{
    background:var(--panel2); border:1px solid var(--line); color:var(--muted);
    border-radius:9px; padding:9px 11px; cursor:pointer; font-size:13px;
  }
  .icon-btn:hover{color:var(--text); border-color:var(--accent)}
  .notice{
    background:rgba(230,162,60,.1); border:1px solid rgba(230,162,60,.4); color:#f0c98a;
    border-radius:9px; padding:8px 12px; font-size:12.5px; max-width:860px; margin:0 auto 8px; display:none;
  }
  .notice b{color:#ffd699}
  .status{font-size:12px; color:var(--muted); text-align:center; padding:4px}
  @media (max-width:520px){
    .msg{max-width:94%}
    #model{min-width:100%}
  }
</style>
</head>
<body>
<header>
  <div class="top">
    <span class="brand"><span class="dot">●</span> AI 模型聚合助手</span>
    <span class="badge">免 Key · 免费模型</span>
    <span class="spacer"></span>
    <div class="seg" id="providerSeg">
      <button data-p="kilo" class="on">Kilo</button>
      <button data-p="zen">Zen</button>
    </div>
  </div>
</header>

<main>
  <div id="chat">
    <div class="empty">
      选择一个模型，开始对话<br>
      <span class="hint">Kilo / Zen 两个 OpenAI 兼容网关，免费模型无需 API Key 即可调用</span>
    </div>
  </div>
</main>

<footer>
  <div class="controls">
    <select id="model" title="选择模型"></select>
    <button class="icon-btn" id="refresh" title="从网关刷新模型列表">↻ 刷新</button>
    <button class="icon-btn" id="settings" title="设置">⚙ 设置</button>
  </div>
  <div class="notice" id="notice"></div>
  <div class="row">
    <input id="input" placeholder="输入问题，回车发送…" onkeydown="if(event.key==='Enter'&&!event.shiftKey)send()">
    <button id="send" onclick="send()">发送</button>
  </div>
  <div class="status" id="status">直连模式 · 未连接</div>
</footer>

<!-- 设置弹层 -->
<div id="settingsPanel" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;align-items:center;justify-content:center;padding:16px">
  <div style="background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;width:100%;max-width:440px">
    <div style="font-weight:700;margin-bottom:14px">⚙ 设置</div>

    <label style="font-size:12.5px;color:var(--muted)">连接方式</label>
    <div class="seg" id="modeSeg" style="margin:6px 0 14px">
      <button data-m="direct" class="on">直连</button>
      <button data-m="proxy">本地代理</button>
    </div>

    <label style="font-size:12.5px;color:var(--muted)">代理地址（代理模式下生效）</label>
    <input id="proxyBase" type="text" value="http://127.0.0.1:8000" style="width:100%;margin:6px 0 14px">

    <label style="font-size:12.5px;color:var(--muted)">Zen API Key（解锁 Claude/GPT/Gemini 等付费模型，留空则只用免费模型）</label>
    <input id="zenKey" type="password" placeholder="sk-…" style="width:100%;margin:6px 0 4px">
    <div style="font-size:11.5px;color:var(--muted);margin-bottom:14px">Key 仅保存在本机浏览器 localStorage，不会上传到其它地方。</div>

    <label style="font-size:12.5px;color:var(--muted)">最大输出 tokens</label>
    <input id="maxTokens" type="number" value="4096" min="1" max="128000" style="width:100%;margin:6px 0 14px">

    <div class="row" style="justify-content:flex-end">
      <button class="icon-btn" onclick="closeSettings()">取消</button>
      <button id="saveSettings" style="padding:9px 18px;border:none;background:var(--accent);color:#fff;border-radius:9px;cursor:pointer;font-weight:600">保存</button>
    </div>
  </div>
</div>

<script>
/* =====================================================================
 *  上游网关定义（与 Rescene APK 内一致）
 * ===================================================================== */
const UPSTREAM = {
  kilo: "https://api.kilo.ai/api/gateway/v1",
  zen:  "https://opencode.ai/zen/v1",
};

/* 离线兜底模型表（运行时优先从 /models 实时拉取完整目录） */
const FALLBACK_MODELS = {
  kilo: [
    ["kilo-auto/free","Auto Free（自动路由）, 免费",true],
    ["stepfun/step-3.7-flash:free","StepFun · Step 3.7 Flash",true],
    ["tencent/hy3:free","Tencent · Hy3 (295B)",true],
    ["poolside/laguna-s-2.1:free","Poolside · Laguna S 2.1 (118B)",true],
    ["poolside/laguna-xs-2.1:free","Poolside · Laguna XS 2.1 (33B)",true],
    ["dots-studio/dots-3-note-preview:free","Dots Studio · Dots3-Note",true],
    ["liquid/lfm-2.5-2.6b:free","LiquidAI · LFM2.5-2.6B",true],
    ["nvidia/nemotron-3.5-lightning:free","NVIDIA · Nemotron 3.5 Lightning (3B)",true],
    ["nvidia/nemotron-3-ultra-550b-a55b:free","NVIDIA · Nemotron 3 Ultra (550B)",true],
    ["nvidia/nemotron-3-super-120b-a12b:free","NVIDIA · Nemotron 3 Super (120B)",true],
    ["nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free","NVIDIA · Nemotron 3 Nano Omni (30B, 推理)",true],
    ["nvidia/nemotron-3.5-content-safety:free","NVIDIA · Nemotron 3.5 Content Safety (4B)",true],
    ["cohere/north-mini-code:free","Cohere · North Mini Code",true],
    ["openrouter/free","OpenRouter · 免费模型路由",true],
  ],
  zen: [
    ["deepseek-v4-flash-free","DeepSeek V4 Flash（推理）",true],
    ["mimo-v2.5-free","Xiaomi · MiMo V2.5",true],
    ["hy3-free","Tencent · Hy3",true],
    ["nemotron-3-ultra-free","NVIDIA · Nemotron 3 Ultra",true],
    ["nemotron-3.5-lightning-free","NVIDIA · Nemotron 3.5 Lightning",true],
    ["laguna-s-2.1-free","Poolside · Laguna S 2.1",true],
    ["muse-spark-1.2-contributor-free","Meta · Muse Spark 1.2（部分地区受限）",true],
    // —— 以下模型需要 Zen API Key ——
    ["claude-opus-5","Anthropic · Claude Opus 5",false],
    ["claude-sonnet-5","Anthropic · Claude Sonnet 5",false],
    ["claude-haiku-4-5","Anthropic · Claude Haiku 4.5",false],
    ["gpt-5.6-luna","OpenAI · GPT-5.6 Luna",false],
    ["gpt-5.6-sol","OpenAI · GPT-5.6 Sol",false],
    ["gpt-5.5-pro","OpenAI · GPT-5.5 Pro",false],
    ["gemini-3.7-flash","Google · Gemini 3.7 Flash",false],
    ["gemini-3.6-flash","Google · Gemini 3.6 Flash",false],
    ["grok-4.6","xAI · Grok 4.6",false],
    ["glm-5.2","Zhipu · GLM 5.2",false],
    ["minimax-m3","MiniMax · M3",false],
    ["kimi-k3","Moonshot · Kimi K3",false],
    ["qwen3.6-plus","Alibaba · Qwen 3.6 Plus",false],
    ["deepseek-v4-pro","DeepSeek V4 Pro",false],
    ["gpt-5-codex","OpenAI · GPT-5 Codex",false],
  ],
};

/* ================= 状态 ================= */
let provider = "kilo";
let models = { kilo: [], zen: [] };        // [{id,name,free}]
let selectedModel = "";
let history = [];
let settings = { mode:"direct", proxyBase:"http://127.0.0.1:8000", zenKey:"", maxTokens:4096 };
let streaming = false;

const $ = id => document.getElementById(id);
const chatEl = $("chat"), statusEl = $("status"), noticeEl = $("notice");

/* ================= 设置读写 ================= */
function loadSettings(){
  try{ Object.assign(settings, JSON.parse(localStorage.getItem("rescene_settings")||"{}")); }catch(e){}
  $("proxyBase").value = settings.proxyBase;
  $("zenKey").value = settings.zenKey;
  $("maxTokens").value = settings.maxTokens;
  applyModeUI();
}
function saveSettings(){
  settings.proxyBase = $("proxyBase").value.trim();
  settings.zenKey = $("zenKey").value.trim();
  settings.maxTokens = parseInt($("maxTokens").value)||4096;
  localStorage.setItem("rescene_settings", JSON.stringify(settings));
  applyModeUI(); closeSettings();
}

/* ================= 提示 ================= */
function showNotice(html){ noticeEl.innerHTML = html; noticeEl.style.display = "block"; }
function hideNotice(){ noticeEl.style.display = "none"; }

function setStatus(t){ statusEl.textContent = t; }

/* ================= 连接模式 ================= */
function applyModeUI(){
  const m = settings.mode;
  $("modeSeg").querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.m===m));
  const p = $("proxyBase").parentElement;
  // 仅高亮，是否禁用显示逻辑简单处理
}
function backend(method, providerName, path, body, headers){
  const base = UPSTREAM[providerName];
  const url = base + path;
  if (settings.mode === "proxy"){
    // 本地代理：/proxy/{kilo|zen}{path}
    const p = settings.proxyBase.replace(/\/$/,"");
    return fetch(p + "/proxy/" + providerName + path, { method, headers:{...headers,"X-Upstream":base}, body });
  }
  return fetch(url, { method, headers, body });
}

/* ================= 模型列表 ================= */
function nameFor(providerName, id){
  const arr = FALLBACK_MODELS[providerName].find(m=>m[0]===id);
  if(arr) return arr[1];
  // 美化 id
  let n = id.replace(/:free$/,"").replace(/\//g," · ").replace(/-/g," ");
  n = n.replace(/(^\w|\s\w)/g, c=>c.toUpperCase()).replace(/ \(Free\)$/i,"");
  return n;
}
function isFree(providerName, id){
  const arr = FALLBACK_MODELS[providerName].find(m=>m[0]===id);
  return arr ? arr[2] : id.includes(":free") || id.endsWith("-free") || id.includes("/free");
}

function fillSelect(){
  const sel = $("model");
  const list = models[provider];
  const prev = selectedModel;
  sel.innerHTML = "";
  const grp = [];
  list.forEach(m=>{
    let lab = m.name + (m.free ? "  · 免费" : "  · 需Key");
    grp.push(`<option value="${m.id.replace(/"/g,'')}">${lab}</option>`);
  });
  sel.innerHTML = grp.join("");
  if(list.some(m=>m.id===prev)) sel.value = prev;
  else if(list.length) sel.value = list[0].id;
  selectedModel = sel.value;
}

async function refreshModels(){
  setStatus("正在拉取模型列表…");
  const jobs = ["kilo","zen"].map(async p=>{
    try{
      const r = await backend("GET", p, "/models");
      if(!r.ok) throw new Error(p+" HTTP "+r.status);
      const d = await r.json();
      const arr = (d.data||[]).map(m=>({
        id:m.id,
        name:(m.name && m.name.replace(/\s*\(free\)$/i,"")) || nameFor(p,m.id),
        free: typeof m.isFree==="boolean" ? m.isFree : isFree(p, m.id),
      }));
      models[p] = arr.length ? arr : fallbackToModels(p);
    }catch(e){
      models[p] = fallbackToModels(p);
    }
  });
  await Promise.all(jobs);
  fillSelect();
  const tot = models.kilo.length + models.zen.length;
  const free = models.kilo.filter(m=>m.free).length + models.zen.filter(m=>m.free).length;
  setStatus(`模型已就绪：共 ${tot} 个（免费 ${free} 个）`);
  hideNotice();
}
function fallbackToModels(p){
  return FALLBACK_MODELS[p].map(([id,name,free])=>({id,name,free}));
}
function switchProvider(p){
  provider = p;
  $("providerSeg").querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.p===p));
  fillSelect();
}

/* ================= 消息渲染 ================= */
function addMsg(who, modelLabel){
  const box = document.createElement("div");
  box.className = "msg " + who;
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = who==="user" ? "我" : (modelLabel||selectedModel||"助手");
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  box.appendChild(meta); box.appendChild(bubble);
  // 去掉空状态
  const empty = chatEl.querySelector(".empty");
  if(empty) empty.remove();
  chatEl.appendChild(box);
  chatEl.scrollTop = chatEl.scrollHeight;
  return {box, bubble, meta};
}

function finishBubble(bubble){
  bubble.querySelectorAll(".cursor").forEach(c=>c.remove());
}

/* ================= 发送 ================= */
async function send(){
  if(streaming) return;
  const input = $("input");
  const q = input.value.trim();
  if(!q) return;
  if(!selectedModel){ showNotice("请先选择一个模型"); return; }

  addMsg("user").bubble.textContent = q;
  input.value = "";
  history.push({role:"user", content:q});

  const {box, bubble, meta} = addMsg("bot", `${provider.toUpperCase()} · ${selectedModel}`);
  bubble.innerHTML = '<span class="cursor"></span>';

  const headers = {"Content-Type":"application/json"};
  if(provider==="zen" && settings.zenKey) headers["Authorization"] = "Bearer " + settings.zenKey;

  const body = {
    model: selectedModel,
    messages: history.slice(-40),
    stream: true,
    max_tokens: settings.maxTokens,
  };

  streaming = true;
  $("send").disabled = true;
  setStatus("生成中…");

  let acc = "";            // 正文
  let think = "";          // 思考内容

  const render = ()=>{
    let html = "";
    if(think){
      html += `<span class="think" id="t${box.dataset.tid}">${escapeHtml(think)}<span class="think-toggle" onclick="toggleThink(this)">展开</span></span>`;
    }
    html += escapeHtml(acc) + '<span class="cursor"></span>';
    bubble.innerHTML = html;
    chatEl.scrollTop = chatEl.scrollHeight;
  };

  try{
    const resp = await backend("POST", provider, "/chat/completions", JSON.stringify(body), headers);

    if(!resp.ok){
      let msg = "请求失败："+resp.status;
      try{ const e = await resp.json(); msg = e?.error?.message || e?.message || msg; }catch(_){}
      // CORS 提示
      if(resp.status===0 || resp.type==="cors") msg = "跨域(CORS)被拦截，请在设置里切换为「本地代理」并启动 server.py";
      throw new Error(msg);
    }

    const ct = resp.headers.get("content-type")||"";
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";

    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buf += decoder.decode(value, {stream:true});
      // SSE 按行解析
      let idx;
      while((idx = buf.indexOf("\n")) >= 0){
        let line = buf.slice(0, idx).replace(/\r$/,"");
        buf = buf.slice(idx+1);
        if(line.startsWith("data:")){
          const payload = line.slice(5).trim();
          if(payload === "[DONE]") continue;
          try{
            const j = JSON.parse(payload);
            const ch = j.choices && j.choices[0];
            if(!ch) continue;
            const d = ch.delta || {};
            if(typeof d.content === "string") acc += d.content;
            if(typeof d.reasoning_content === "string") think += d.reasoning_content;
            else if(typeof d.reasoning === "string") think += d.reasoning;
            // 某些字段放在 message 里（非流式兜底）
            if(ch.message && typeof ch.message.content === "string") acc += ch.message.content;
            render();
          }catch(_){}
        } else if(line.trim()==="") {
          // SSE 空行, 忽略
        }
      }
    }
    // 非流式兜底（部分网关可能返回一次性 JSON）
    if(!acc && !think){
      try{
        const j = JSON.parse(buf);
        const m = j.choices?.[0]?.message;
        acc = m?.content || "";
        think = m?.reasoning_content || m?.reasoning || "";
        render();
        if(!acc && !think) throw new Error("空回复");
      }catch(e){
        if(!acc) throw new Error("未收到有效回复，请换一个模型重试");
      }
    }
    finishBubble(bubble);
    if(think){ // 修正折叠标签
      const t = bubble.querySelector(".think");
      if(t) t.classList.add("open");
    }
    history.push({role:"assistant", content: acc || "(思考已完成)"});
  }catch(e){
    bubble.textContent = "请求出错：" + e.message;
    bubble.style.color = "var(--danger)";
    showNotice("<b>"+e.message+"</b>　可尝试：① 切换模型 ② 设置里换成「本地代理」并运行 server.py");
  }finally{
    streaming = false;
    $("send").disabled = false;
    setStatus(`模型已就绪（${models.kilo.length+models.zen.length} 个）`);
    input.focus();
  }
}

/* ================= 小工具 ================= */
function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function toggleThink(el){
  const t = el.closest(".think");
  t.classList.toggle("open");
  el.textContent = t.classList.contains("open") ? "收起" : "展开";
}
function openSettings(){ $("settingsPanel").style.display = "flex"; }
function closeSettings(){ $("settingsPanel").style.display = "none"; }

/* ================= 事件绑定 ================= */
$("providerSeg").addEventListener("click", e=>{ if(e.target.tagName==="BUTTON") switchProvider(e.target.dataset.p); });
$("refresh").addEventListener("click", refreshModels);
$("settings").addEventListener("click", openSettings);
$("saveSettings").addEventListener("click", saveSettings);
$("settingsPanel").addEventListener("click", e=>{ if(e.target.id==="settingsPanel") closeSettings(); });
$("modeSeg").addEventListener("click", e=>{
  if(e.target.tagName==="BUTTON"){ settings.mode = e.target.dataset.m; applyModeUI(); }
});
$("model").addEventListener("change", e=>{ selectedModel = e.target.value; });

/* ================= 启动 ================= */
(async function init(){
  loadSettings();
  models.kilo = fallbackToModels("kilo");
  models.zen = fallbackToModels("zen");
  fillSelect();
  refreshModels();      // 尝试实时刷新全量目录
})();
</script>
</body>
</html>
